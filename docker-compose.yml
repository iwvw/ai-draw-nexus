services:
  ai-draw-nexus:
    image: ghcr.io/iwvw/ai-draw-nexus:latest
    container_name: ai-draw-nexus
    ports:
      - "8787:8787"
    environment:
      # AI Provider Configuration (openai / anthropic / azure)
      - AI_PROVIDER=openai
      - AI_BASE_URL=https://api.openai.com/v1
      - AI_API_KEY=sk-your-api-key-here
      - AI_MODEL_ID=gpt-4o
      # Access Password (Optional)
      - ACCESS_PASSWORD=your-secret-password
      # Rate Limiting (Optional)
      - DAILY_QUOTA=10
      # SQLite database location (defaults to /app/data/nexus.db)
      - DATABASE_PATH=/app/data/nexus.db
      # Schema bootstrap: 用镜像内置 /app/schema.sql，避免 data/ 卷 shadow 后初始化失败
      - SCHEMA_PATH=/app/schema.sql
    volumes:
      # Persist SQLite database
      - ./data:/app/data
      # Optional: mount .env for detailed config
      # - ./.env:/app/.env
    restart: always
