services:
  ai-draw-nexus:
    image: ghcr.io/iwvw/ai-draw-nexus:latest
    container_name: ai-draw-nexus
    ports:
      - "8487:8787"
    environment:
      # 生产必需：JWT 签名密钥（至少 32 位随机串，勿用明文示例）
      - JWT_SECRET=please-set-a-random-string-at-least-32-chars
      # SQLite 落盘到卷内目录（持久化）
      - DATABASE_PATH=/app/data/nexus.db
      # schema 用镜像内置文件，避免 data/ 卷 shadow 后初始化失败
      - SCHEMA_PATH=/app/schema.sql
    volumes:
      - ./data:/app/data
    restart: unless-stopped